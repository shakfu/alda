name: Build Windows

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows ${{ matrix.variant }}
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    strategy:
      fail-fast: false
      matrix:
        include:
          # TinySoundFont only (default, smallest)
          - variant: tsf
            cmake_args: ""
            artifact_suffix: windows-tsf

          # TinySoundFont + Web host
          - variant: tsf-web
            cmake_args: "-DBUILD_WEB_HOST=ON"
            artifact_suffix: windows-tsf-web

          # TinySoundFont + Csound
          - variant: tsf-csound
            cmake_args: "-DBUILD_CSOUND_BACKEND=ON"
            artifact_suffix: windows-tsf-csound

    env:
      BUILD_DIR: build
      BUILD_TYPE: Release

    steps:
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            make
            git

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake
        run: |
          cmake -S . -B ${{ env.BUILD_DIR }} \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DBUILD_TESTING=ON \
            ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build ${{ env.BUILD_DIR }} --config ${{ env.BUILD_TYPE }}

      - name: Run tests
        run: |
          cd ${{ env.BUILD_DIR }}
          ctest --output-on-failure -C ${{ env.BUILD_TYPE }}

      - name: Collect artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts
          Copy-Item "build/psnd.exe" "artifacts/psnd-${{ matrix.artifact_suffix }}.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: psnd-${{ matrix.artifact_suffix }}
          path: artifacts/*
          if-no-files-found: error

  # Build with MSVC for comparison (optional)
  build-windows-msvc:
    name: Windows MSVC ${{ matrix.variant }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: tsf
            cmake_args: ""
            artifact_suffix: windows-msvc-tsf

    env:
      BUILD_DIR: build
      BUILD_TYPE: Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake
        run: |
          cmake -S . -B ${{ env.BUILD_DIR }} `
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
            -DBUILD_TESTING=ON `
            ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build ${{ env.BUILD_DIR }} --config ${{ env.BUILD_TYPE }}

      - name: Run tests
        run: |
          cd ${{ env.BUILD_DIR }}
          ctest --output-on-failure -C ${{ env.BUILD_TYPE }}

      - name: Collect artifact
        run: |
          New-Item -ItemType Directory -Force -Path artifacts
          Copy-Item "build/${{ env.BUILD_TYPE }}/psnd.exe" "artifacts/psnd-${{ matrix.artifact_suffix }}.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: psnd-${{ matrix.artifact_suffix }}
          path: artifacts/*
          if-no-files-found: error

  bundle-windows:
    name: Bundle Windows binaries
    runs-on: ubuntu-latest
    needs: [build-windows, build-windows-msvc]
    if: always() && needs.build-windows.result == 'success'
    steps:
      - name: Download all Windows artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: psnd-windows*
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist/

      - name: Create Windows archive
        run: |
          cd dist
          zip -r ../psnd-windows-all.zip .

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: psnd-windows-bundle
          path: psnd-windows-all.zip
          if-no-files-found: warn
