name: Build Windows

on: [workflow_dispatch]
  # push:
  #   branches: [main, dev]
  # pull_request:
  #   branches: [main]
  # workflow_dispatch:

jobs:
  # Build with MSYS2/MinGW (GCC toolchain) - TSF only
  build-windows-mingw:
    name: Windows MinGW
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: msys2 {0}
    env:
      BUILD_DIR: build
      BUILD_TYPE: Release

    steps:
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            make
            git

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake
        run: |
          cmake -S . -B ${{ env.BUILD_DIR }} \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build ${{ env.BUILD_DIR }} --config ${{ env.BUILD_TYPE }}

      - name: Run tests
        run: |
          cd ${{ env.BUILD_DIR }}
          ctest --output-on-failure --timeout 120 -C ${{ env.BUILD_TYPE }}

      - name: Collect artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts
          Copy-Item "build/psnd.exe" "artifacts/psnd-windows-mingw.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: psnd-windows-mingw
          path: artifacts/*
          if-no-files-found: error

  # Build with MSVC (Visual Studio toolchain)
  # Note: dirent.h and posix_compat.h are bundled in source/thirdparty/dirent/
  build-windows-msvc:
    name: Windows MSVC ${{ matrix.variant }}
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # TinySoundFont only (default, smallest)
          - variant: tsf
            cmake_args: ""
            artifact_suffix: windows-msvc-tsf
            needs_flexbison: false

          # TinySoundFont + Csound
          - variant: tsf-csound
            cmake_args: "-DBUILD_CSOUND_BACKEND=ON"
            artifact_suffix: windows-msvc-tsf-csound
            needs_flexbison: true

          # Full: FluidSynth + Csound + Web
          - variant: full
            cmake_args: "-DBUILD_FLUID_BACKEND=ON -DBUILD_CSOUND_BACKEND=ON -DBUILD_WEB_HOST=ON"
            artifact_suffix: windows-msvc-full
            needs_flexbison: true

    env:
      BUILD_DIR: build
      BUILD_TYPE: Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download WinFlexBison
        if: matrix.needs_flexbison
        run: |
          $url = "https://github.com/lexxmark/winflexbison/releases/download/v2.5.25/win_flex_bison-2.5.25.zip"
          $dest = "source/thirdparty/winflexbison"
          New-Item -ItemType Directory -Force -Path $dest
          Invoke-WebRequest -Uri $url -OutFile "$dest/winflexbison.zip"
          Expand-Archive -Path "$dest/winflexbison.zip" -DestinationPath $dest -Force
          Remove-Item "$dest/winflexbison.zip"

      - name: Configure CMake
        run: |
          cmake -S . -B ${{ env.BUILD_DIR }} `
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
            -DBUILD_TESTING=ON `
            ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build ${{ env.BUILD_DIR }} --config ${{ env.BUILD_TYPE }}

      - name: Run tests
        run: |
          cd ${{ env.BUILD_DIR }}
          ctest --output-on-failure --timeout 120 -C ${{ env.BUILD_TYPE }}

      - name: Collect artifact
        run: |
          New-Item -ItemType Directory -Force -Path artifacts
          Copy-Item "build/${{ env.BUILD_TYPE }}/psnd.exe" "artifacts/psnd-${{ matrix.artifact_suffix }}.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: psnd-${{ matrix.artifact_suffix }}
          path: artifacts/*
          if-no-files-found: error

  bundle-windows:
    name: Bundle Windows binaries
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [build-windows-mingw, build-windows-msvc]
    if: always() && (needs.build-windows-mingw.result == 'success' || needs.build-windows-msvc.result == 'success')
    steps:
      - name: Download all Windows artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: psnd-windows-*
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist/

      - name: Create Windows archive
        run: |
          cd dist
          zip -r ../psnd-windows-all.zip .

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: psnd-windows-bundle
          path: psnd-windows-all.zip
          if-no-files-found: warn
