# psnd Configuration
# This file configures the psnd editor.
# Settings here override defaults but can be overridden by CLI flags.

[editor]
# Color theme for syntax highlighting
# Available themes: see .psnd/themes/ directory
theme = "nord"

# Show line numbers in the gutter
line_numbers = true

# Tab width for indentation
tab_width = 4

# Lua scripting (opt-in for security)
# When enabled, .psnd/init.lua is loaded at startup
[editor.lua]
enabled = false

[audio]
# Audio backend: "tsf" (TinySoundFont), "fluid" (FluidSynth),
#                "csound", or "midi" (external)
backend = "tsf"

# Path to SoundFont file for tsf/fluid backends
# Leave empty to use the default GM soundfont
soundfont = ""

[link]
# Ableton Link synchronization
enabled = false
tempo = 120

# Keybindings
# Format: "key" = "command"
# Keys: ctrl-a through ctrl-z (except ctrl-i/tab, ctrl-m/enter)
#
# Configurable commands (can be rebound):
#   save       - Save current file
#   find       - Search in file (terminal only)
#   stop       - Stop playback
#   lua_repl   - Toggle Lua REPL (requires lua.enabled = true)
#   new_buffer - Create new buffer
#   copy       - Copy selection to clipboard
#   word_wrap  - Toggle word wrap
#
# Built-in commands (always work, can't be rebound):
#   Ctrl-Q     - Quit (with unsaved changes confirmation)
#   Ctrl-E     - Evaluate selection/line
#   Ctrl-P     - Play entire file
#   Ctrl-X     - Prefix for buffer commands (Ctrl-X n/p/k)
#
[keybindings]
"ctrl-s" = "save"
"ctrl-g" = "stop"
"ctrl-f" = "find"
"ctrl-l" = "lua_repl"
"ctrl-t" = "new_buffer"
"ctrl-c" = "copy"
"ctrl-w" = "word_wrap"
