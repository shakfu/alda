# Basic 16-Color Theme for Loki Editor
# Simple theme using standard ANSI colors for basic terminals 

[meta]
name = "Basic 16-Color"
description = "Simple theme using standard ANSI colors for basic terminals "

[colors]
# Base
normal = [192, 192, 192]
nonprint = [128, 128, 128]
comment = [128, 128, 128]
mlcomment = [128, 128, 128]
keyword1 = [128, 0, 128]
keyword2 = [0, 128, 128]
string = [0, 128, 0]
number = [128, 128, 0]
match = [128, 128, 0]

# Function
function = [0, 0, 128]
function_builtin = [0, 128, 128]
function_call = [0, 0, 128]
function_method = [0, 0, 128]
function_macro = [0, 128, 128]

# Variable
variable = [192, 192, 192]
variable_builtin = [128, 0, 0]
variable_parameter = [0, 128, 128]
variable_field = [192, 192, 192]
variable_property = [192, 192, 192]

# Keyword
keyword_control = [128, 0, 128]
keyword_function = [128, 0, 128]
keyword_return = [128, 0, 128]
keyword_operator = [128, 0, 128]
keyword_import = [128, 0, 128]
keyword_type = [128, 128, 0]
keyword_modifier = [128, 0, 128]

# String
string_escape = [0, 128, 128]
string_regex = [0, 128, 128]
string_special = [0, 128, 0]

# Number
number_float = [128, 128, 0]

# Literal
boolean = [128, 128, 0]
constant = [128, 128, 0]
constant_builtin = [128, 128, 0]

# Comment
comment_doc = [128, 128, 128]

# Type
type = [0, 128, 128]
type_builtin = [0, 128, 128]
type_parameter = [0, 128, 128]
type_qualifier = [128, 0, 128]

# Operator
operator = [192, 192, 192]
punctuation = [192, 192, 192]
punctuation_bracket = [192, 192, 192]
punctuation_delimiter = [192, 192, 192]

# Special
constructor = [128, 128, 0]
namespace = [0, 128, 128]
module = [0, 128, 128]
label = [128, 128, 0]
tag = [128, 0, 0]
tag_attribute = [128, 128, 0]
preprocessor = [128, 0, 128]

# Diagnostic
error = [128, 0, 0]
warning = [128, 128, 0]
